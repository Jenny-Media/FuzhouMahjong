name: FuzhouMahjong
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  FuzhouCore:
    path: .
targets:
  FuzhouMahjong:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FuzhouCore
        product: FuzhouCore
      - package: FuzhouCore
        product: FuzhouNearby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.xcv58.FuzhouMahjong
        MARKETING_VERSION: '0.2.5'
        CURRENT_PROJECT_VERSION: '7'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 福州麻将
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '6.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    info:
      path: AppInfo.plist
      properties:
        NSLocalNetworkUsageDescription: 用于发现附近的福州麻将牌桌，并与你的牌友联机。
        NSCameraUsageDescription: 用于扫描牌友的福州麻将牌桌邀请二维码。
        NSBonjourServices: ['_fuzhou._tcp']
        CFBundleURLTypes:
          - CFBundleURLName: xyz.xcv58.FuzhouMahjong.invite
            CFBundleURLSchemes: [fuzhou-mahjong]
    scheme:
      gatherCoverageData: false
