name: FuzhouMahjong
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '17.0'
packages:
  FuzhouCore:
    path: .
targets:
  FuzhouMahjong:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Sounds/MaterialSounds]
      - path: App/Sounds/MaterialSounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: FuzhouCore
        product: FuzhouCore
      - package: FuzhouCore
        product: FuzhouNearby
      - package: FuzhouCore
        product: FuzhouAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.FuzhouMahjong$(VALIDATION_BUNDLE_SUFFIX)
        MARKETING_VERSION: '1.2.1'
        CURRENT_PROJECT_VERSION: '37'
        DEVELOPMENT_TEAM: 5736QK4NZX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 福州麻将
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '6.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AppInfo.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 用来查找附近牌桌，和身边的牌友一起打麻将。
        NSCameraUsageDescription: 用来扫描牌友的邀请二维码，加入附近牌桌。
        NSBonjourServices: ['_fuzhou._tcp']
        CFBundleURLTypes:
          - CFBundleURLName: media.jenny.FuzhouMahjong.invite
            CFBundleURLSchemes: [fuzhou-mahjong]
    scheme:
      gatherCoverageData: false

  FuzhouPurchasesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PurchaseTests
        excludes: [FuzhouMahjong.storekit]
      - path: PurchaseTests/FuzhouMahjong.storekit
        buildPhase: resources
    dependencies:
      - target: FuzhouMahjong
      - package: FuzhouCore
        product: FuzhouAccess
      - package: FuzhouCore
        product: FuzhouCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.FuzhouMahjong.PurchaseTests$(VALIDATION_BUNDLE_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '6.0'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FuzhouMahjong.app/FuzhouMahjong
        BUNDLE_LOADER: $(TEST_HOST)
  FuzhouPurchaseFlowTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: PurchaseTests/FuzhouMahjong.storekit
        buildPhase: resources
    dependencies:
      - target: FuzhouMahjong
      - package: FuzhouCore
        product: FuzhouCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.FuzhouMahjong.PurchaseFlowTests$(VALIDATION_BUNDLE_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '6.0'
        TEST_TARGET_NAME: FuzhouMahjong
schemes:
  FuzhouMahjongPurchases:
    build:
      targets:
        FuzhouMahjong: all
    run:
      config: Debug
      storeKitConfiguration: PurchaseTests/FuzhouMahjong.storekit
    test:
      testPlans:
        - path: Purchases.xctestplan
          defaultPlan: true
      targets: [FuzhouPurchasesTests, FuzhouPurchaseFlowTests]
      gatherCoverageData: false
